# Continuous Deployment Workflow
# Runs when you create a git tag (e.g., git tag v1.6.2)
# Automatically creates a GitHub release and updates documentation

name: Release - Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.6.2, v2.0.0

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Extract version from tag
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"
      
      # Step 3: Read CHANGELOG
      - name: Read CHANGELOG
        id: changelog
        run: |
          # Extract the first release section from CHANGELOG.md
          sed -n '/^## \[/,/^## \[/p' CHANGELOG.md | head -n -1 > release_notes.txt
          echo "release_notes=$(cat release_notes.txt)" >> $GITHUB_OUTPUT
      
      # Step 4: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "nz-ingest ${{ steps.version.outputs.version }}"
          body: |
            # nz-ingest ${{ steps.version.outputs.version }}
            
            Smart photo ingest appliance for TrueNAS
            
            ## Installation via TrueNAS
            
            1. Go to **Apps → Discover**
            2. Click **+ Add Catalog**
            3. Enter:
               - **Name:** nz-ingest
               - **Repository:** https://github.com/ballhog/nz-ingest
               - **Branch:** main
            4. Search for "nz-ingest" and click **Install**
            
            ## What's New
            
            See [CHANGELOG.md](https://github.com/ballhog/nz-ingest/blob/main/CHANGELOG.md) for details.
            
            ## Helm Chart
            
            Deploy directly with Helm:
            ```bash
            helm repo add nz-ingest https://github.com/ballhog/nz-ingest
            helm install nz-ingest nz-ingest/nz-ingest
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-changelog:
    runs-on: ubuntu-latest
    name: Verify CHANGELOG Updated
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check CHANGELOG has version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if grep -q "$VERSION" CHANGELOG.md; then
            echo "✓ CHANGELOG.md includes $VERSION"
          else
            echo "⚠ Warning: CHANGELOG.md does not mention $VERSION"
            echo "Next time, update CHANGELOG.md before creating the tag!"
          fi
