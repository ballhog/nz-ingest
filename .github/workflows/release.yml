# Continuous Deployment Workflow
# Runs when you create a git tag (e.g., git tag v1.6.2)

name: Release - Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      # Simple, reliable release creation using GitHub CLI
      - name: Create Release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "nz-ingest ${{ steps.version.outputs.version }}" \
            --notes "See CHANGELOG.md for details on this release."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
